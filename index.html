<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모두의 공기청정기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --sky:#1f86d1; --sky-d:#135f98; --sky-l:#e4f1fb;
  --mint:#119e78; --mint-l:#e1f5ee;
  --red:#d24848; --red-l:#fcebeb;
  --amber:#e0952a; --amber-l:#fff4e2;
  --ink:#17212c; --muted:#5e6a78; --line:#d9e4ee; --bg:#f1f6fa; --card:#fff; --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)} .small{font-size:13px}
.err{color:var(--red);font-weight:600;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* buttons */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:16px;background:#e7eef4}
.btn.primary{background:var(--sky);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.block{display:block;width:100%}
.btn.big{padding:17px 18px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;background:#fff;margin:6px 0 12px}
.field:focus{outline:none;border-color:var(--sky)}
label{display:block;font-weight:600;font-size:14px;color:var(--muted)}

/* student */
.s-wrap{max-width:480px;margin:0 auto;padding:16px 16px 90px}
.hero{background:linear-gradient(135deg,#1f86d1 0%,#35b3c6 100%);color:#fff;border-radius:var(--r);padding:22px 20px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:8px 0 2px;font-size:28px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.93}
.badge{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:20px;margin:0 0 14px;line-height:1.4;letter-spacing:-.01em}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sky-d);background:var(--sky-l);padding:3px 10px;border-radius:99px;margin-bottom:10px}
.code-in{font-size:34px;text-align:center;letter-spacing:.3em;font-weight:800}
.stepper{display:flex;gap:6px;margin:0 0 14px}
.stepper span{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-top:8px;border-top:4px solid var(--line)}
.stepper span.on{color:var(--sky-d);border-color:var(--sky)}
.stepper span.done{color:var(--mint);border-color:var(--mint)}
.rules{margin:0;padding-left:20px}
.rules li{margin-bottom:7px}
.rules small{color:var(--muted)}
.formula{background:var(--sky-l);border-radius:12px;padding:10px 12px;font-weight:700;text-align:center;margin:12px 0;color:var(--sky-d)}
table.pay{width:100%;border-collapse:collapse;text-align:center;font-variant-numeric:tabular-nums}
table.pay th,table.pay td{border-bottom:1px solid var(--line);padding:8px 4px}
table.pay thead th{font-size:13px;color:var(--muted);font-weight:600}
table.pay tbody th{font-weight:700}
.goal{margin:14px 0 0;padding:11px 13px;border-radius:12px;background:var(--amber-l);color:#734807}
.q-head{display:flex;justify-content:space-between;align-items:center}
.q-dots{display:flex;gap:6px}
.q-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.q-dots i.on{background:var(--sky)} .q-dots i.done{background:var(--mint)}
.q-num{font-size:14px;font-weight:800;color:var(--sky)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:600}
.opt:not(:disabled):active{background:var(--sky-l)}
.opt-k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef3f7;font-size:14px;font-weight:800;color:var(--muted)}
.opt.right{border-color:var(--mint);background:var(--mint-l)} .opt.right .opt-k{background:var(--mint);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l)} .opt.wrong .opt-k{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:14px}
.fb p{margin:6px 0 12px}
.fb.right{background:var(--mint-l);color:#0b5e47}
.fb.wrong{background:var(--red-l);color:#8a2626}
details.peek summary{font-weight:700;cursor:pointer;color:var(--sky-d)}
details.peek[open] summary{margin-bottom:12px}
.yn{display:grid;gap:10px}
.yn .btn{padding:18px;font-size:18px}
.amt{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:4px 0 6px}
.amt input{width:170px;text-align:center;font-size:44px;font-weight:800;border:0;border-bottom:3px solid var(--sky);background:transparent;padding:2px 0}
.amt input:focus{outline:none}
.amt span{font-weight:700;color:var(--muted)}
.amt input::-webkit-outer-spin-button,.amt input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amt input{-moz-appearance:textfield;appearance:textfield}
.mybox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.mybox div{border-radius:14px;padding:10px 12px;text-align:center}
.mybox .mine{background:var(--sky-l);color:var(--sky-d)}
.mybox .goalb{background:var(--mint-l);color:#0b5e47}
.mybox span{display:block;font-size:13px;font-weight:700}
.mybox b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.25}
.mybox small{display:block;font-size:12px;opacity:.8}
.mynote{font-size:14px;color:var(--muted);margin:0 0 14px;line-height:1.55}
.rulebtn{display:block;width:100%;border:1.5px dashed var(--sky);background:#fff;color:var(--sky-d);border-radius:14px;padding:12px;font-weight:700;font-size:15px;margin-bottom:14px}
.best{background:var(--amber-l);border-color:#f1d29a}
.m-box.rules-m{max-height:86vh;overflow-y:auto;width:min(460px,100%)}
.howto{display:flex;gap:8px;align-items:flex-start;background:var(--amber-l);color:#6b4306;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;margin:4px 0 14px}
.nl{position:relative;padding:0 14px;margin:6px 0 4px}
.nl input[type=range]{-webkit-appearance:none;appearance:none;width:calc(100% + 28px);margin:0 -14px;height:34px;background:transparent;display:block;touch-action:none}
.nl input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--sky) var(--p,0%),#dfe8ef var(--p,0%))}
.nl input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:#dfe8ef}
.nl input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:var(--sky)}
.nl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--sky);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.nl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--sky)}
.nl input[type=range]:disabled{opacity:.5}
.ticks{position:relative;height:34px;margin-bottom:6px}
.ticks span{position:absolute;top:0;transform:translateX(-50%);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.ticks span::before{content:"";display:block;width:2px;height:8px;margin:0 auto 6px;background:#b9c7d3}
.ticks span.maj{font-weight:800;color:var(--ink)}
.ticks span.maj::before{height:12px;margin-bottom:2px;background:var(--ink)}
.ticks span.mid{font-size:0}
.ticks span.mid::before{height:6px;margin-bottom:8px}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;text-align:center}
.pv div{background:#f4f8fb;border-radius:12px;padding:8px 4px}
.pv span{display:block;font-size:12px;color:var(--muted)}
.pv b{font-size:18px;font-variant-numeric:tabular-nums}
.confirm{background:var(--sky-l);border-radius:14px;padding:14px;text-align:center}
.confirm p{margin:0 0 12px}
.center{text-align:center}
.big-num{font-size:60px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0}
.note{display:inline-block;background:var(--amber-l);color:#734807;font-weight:700;border-radius:99px;padding:6px 14px;margin-top:6px}
.spin{width:38px;height:38px;border:4px solid var(--sky-l);border-top-color:var(--sky);border-radius:50%;margin:6px auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.verdict{font-size:24px;font-weight:800;margin:4px 0 6px}
.verdict.ok{color:var(--mint)} .verdict.no{color:var(--red)}

/* goal bar (shared) */
.gbar{position:relative;height:22px;border-radius:99px;background:#e9eff4;margin:26px 0 8px}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--red);transition:width .8s ease}
.gbar i.ok{background:var(--mint)}
.gbar b{position:absolute;top:-8px;bottom:-8px;width:3px;background:var(--ink);border-radius:2px}
.gbar b span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;margin-bottom:2px}

/* teacher */
.t-wrap{max-width:1320px;margin:0 auto;padding:20px 24px 90px;font-size:18px}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.t-top h1{margin:0;font-size:28px;letter-spacing:-.02em}
.t-top h1 small{font-size:16px;color:var(--muted);font-weight:600;margin-left:6px}
.badge.dark{background:var(--sky-l);color:var(--sky-d)}
.t-cols{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.cls-list{display:grid;gap:10px}
.cls{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px}
.cls:hover{border-color:var(--sky)}
.cls b{font-size:19px}
.cls .muted{font-size:14px;margin-left:8px}
.chipS{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.chipS.open{background:var(--sky-l);color:var(--sky-d)}
.chipS.closed{background:var(--amber-l);color:#7a4c06}
.chipS.revealed{background:var(--mint-l);color:#0b5e47}
table.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center}
table.cmp thead th{color:var(--muted);font-size:15px;font-weight:600}
table.cmp tbody th{text-align:left}
.t-room{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.join{text-align:center}
#qr{display:flex;justify-content:center;margin:10px 0}
#qr img,#qr canvas{border:10px solid #fff;border-radius:8px}
.url{font-size:13px;color:var(--muted);word-break:break-all}
.bigcode{font-size:92px;font-weight:900;letter-spacing:.12em;line-height:1;margin:6px 0 4px;color:var(--sky-d)}
.ctr{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.ctr div{background:#f4f8fb;border-radius:14px;padding:14px;text-align:center}
.ctr span{display:block;color:var(--muted);font-weight:600}
.ctr b{font-size:52px;font-variant-numeric:tabular-nums;line-height:1.15}
.ctr small{font-size:20px;color:var(--muted);font-weight:600}
.pbar{height:16px;border-radius:99px;background:#e9eff4;overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;background:var(--sky);transition:width .5s}
.wrongs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.wrongs span{background:#f4f8fb;border-radius:10px;padding:6px 12px;font-size:15px}
.wrongs span.hot{background:var(--red-l);color:#8a2626;font-weight:700}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ctrl .btn{font-size:19px;padding:16px 24px}
.r-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.r-steps{display:flex;gap:6px;flex-wrap:wrap}
.r-step{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;color:var(--muted);font-size:15px}
.r-step.on{background:var(--sky);border-color:var(--sky);color:#fff}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{min-height:280px;margin:0}
.p-t{font-weight:800;color:var(--sky-d);margin-bottom:10px}
.panel.hide{display:grid;place-items:center;background:repeating-linear-gradient(45deg,#f6f9fb,#f6f9fb 12px,#eef3f7 12px,#eef3f7 24px);color:#a7b4c0;font-size:64px;font-weight:900}
.bigv{font-size:56px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.bigv small{font-size:22px;color:var(--muted);font-weight:600}
.dist-row{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin:9px 0}
.dist-row .dl{font-weight:700;text-align:right}
.dtrack{height:28px;background:#eef3f7;border-radius:8px;overflow:hidden}
.dtrack i{display:block;height:100%;background:var(--sky);border-radius:8px;transition:width .8s}
.dtrack i.zero{background:var(--amber)}
.dist-row .dc{font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kv div{background:#f4f8fb;border-radius:12px;padding:10px;text-align:center}
.kv span{display:block;font-size:14px;color:var(--muted)}
.kv b{font-size:26px;font-variant-numeric:tabular-nums}
.tax table.cmp td,.tax table.cmp th{font-size:22px;padding:14px 10px}
.tax table.cmp td:last-child{background:var(--mint-l);font-weight:700}
.tax table.cmp thead th{font-size:18px;color:var(--ink);font-weight:800}
.tax table.cmp thead small{font-weight:600;color:var(--muted);font-size:14px}

/* misc */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#17212c;color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:.95}
#modal{position:fixed;inset:0;background:rgba(15,25,35,.45);display:grid;place-items:center;z-index:60;padding:16px}
#modal[hidden]{display:none}
.m-box{background:#fff;border-radius:18px;padding:22px;width:min(420px,100%)}
.m-box h3{margin:0 0 8px;font-size:20px}
.m-box p{margin:0 0 14px;color:var(--muted)}
.m-act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#demobar{position:fixed;left:0;right:0;bottom:0;background:#17212c;color:#fff;font-size:13px;padding:8px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:40}
#demobar button{border:0;border-radius:8px;padding:6px 10px;background:#33414f;color:#fff;font-weight:700;font-size:13px}
#demobar button.on{background:var(--sky)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}


/* 디벗 패드(태블릿) */
@media (min-width:700px){
  .s-wrap{max-width:760px;padding:28px 28px 100px;font-size:18px}
  .hero{padding:30px 32px 28px}
  .hero h1{font-size:38px}
  .hero p{font-size:19px}
  .card{padding:26px 28px}
  .card h2{font-size:26px}
  .stepper span{font-size:15px}
  .tag{font-size:14px}
  .opt{font-size:20px;padding:18px}
  .opt-k{width:34px;height:34px;font-size:16px}
  .btn.big,.btn.block{font-size:19px}
  .yn{grid-template-columns:1fr 1fr}
  .yn .btn{padding:24px;font-size:21px}
  .mybox b{font-size:34px} .mybox span{font-size:15px} .mybox small{font-size:14px}
  .mynote{font-size:16px}
  .amt input{width:220px;font-size:60px}
  .howto{font-size:16px}
  .ticks span{font-size:15px}
  .ticks span.mid{font-size:15px}
  .pv b{font-size:24px} .pv span{font-size:14px}
  .big-num{font-size:84px}
  .verdict{font-size:30px}
  .rulebtn{font-size:17px;padding:15px}
  .code-in{font-size:44px}
  .m-box.rules-m{width:min(640px,100%);font-size:18px}
  table.pay th,table.pay td{padding:11px 6px}
}
@media (max-width:900px){
  .t-cols,.t-room,.r-grid{grid-template-columns:1fr}
  .t-wrap{padding:16px;font-size:16px}
  .bigcode{font-size:64px}
  .ctr b{font-size:38px}
}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<div id="modal" hidden></div>
<div id="demobar" hidden></div>

<script>
/* =========================================================
   설정: Apps Script 웹 앱 URL을 아래에 붙여 넣으세요.
   비워 두면 '데모 모드'로 이 브라우저 안에서만 동작합니다.
   ========================================================= */
const API_URL = '';

const DEMO = !API_URL;
const QS = new URLSearchParams(location.search);
let VIEW = QS.has('teacher') ? 'teacher' : 'student';
const $app = document.getElementById('app');
const fmt = n => Math.round(Number(n || 0)).toLocaleString('ko-KR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;

/* ---------- 저장소 (사용 불가 환경 대비) ---------- */
const MEM = {};
const store = {
  get(k){ try{ const v = localStorage.getItem(k); return v == null ? (k in MEM ? MEM[k] : null) : v; }catch(e){ return k in MEM ? MEM[k] : null; } },
  set(k, v){ MEM[k] = v; try{ localStorage.setItem(k, v); }catch(e){} },
  del(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} },
  keys(){ let ks = Object.keys(MEM); try{ for(let i=0;i<localStorage.length;i++) ks.push(localStorage.key(i)); }catch(e){} return [...new Set(ks)]; }
};
const jget = k => { try{ return JSON.parse(store.get(k)); }catch(e){ return null; } };
const jset = (k, v) => store.set(k, JSON.stringify(v));

/* ---------- 공통 UI ---------- */
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function modal({title, body = '', ok = '확인', cancel = '취소', input = null}){
  return new Promise(res => {
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="m-box"><h3>${esc(title)}</h3>${body ? `<p>${body}</p>` : ''}
      ${input ? `<input id="m-in" class="field" type="number" inputmode="numeric" value="${esc(input.value)}">` : ''}
      <div class="m-act"><button class="btn ghost" id="m-no">${cancel}</button><button class="btn primary" id="m-ok">${ok}</button></div></div>`;
    m.hidden = false;
    const done = v => { m.hidden = true; m.innerHTML = ''; res(v); };
    m.querySelector('#m-no').onclick = () => done(null);
    m.querySelector('#m-ok').onclick = () => done(input ? m.querySelector('#m-in').value : true);
  });
}
const loadingHTML = () => `<div class="loading"><div class="spin"></div>불러오는 중…</div>`;
function stopTimers(){ clearInterval(ST.timer); clearInterval(TT.timer); ST.timer = TT.timer = null; }

/* ---------- 서버 호출 ---------- */
async function api(a, p = {}){
  if (DEMO) return Mock.call(a, p);
  const url = API_URL + '?a=' + encodeURIComponent(a) + '&p=' + encodeURIComponent(JSON.stringify(p)) + '&_=' + Date.now();
  let r;
  try{ r = await fetch(url); }catch(e){ throw new Error('인터넷 연결을 확인해 주세요.'); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '오류가 났어요.');
  return j.data;
}

/* ---------- 게임 로직 (Code.gs와 동일) ---------- */
function Logic(a, p, db, PIN) {
  var now = new Date().toISOString();
  var dirty = false;
  function S(v) { return v == null ? '' : String(v); }
  function N(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function newRound() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function findClass(code) {
    for (var i = 0; i < db.classes.length; i++) if (S(db.classes[i].code) === S(code)) return db.classes[i];
    throw new Error('학급 코드를 찾을 수 없어요. 코드를 다시 확인해 주세요.');
  }
  function playersOf(c) {
    return db.players.filter(function (x) { return S(x.code) === S(c.code) && S(x.round) === S(c.round); });
  }
  function getPlayer(c, id, create) {
    if (!S(id)) throw new Error('기기 정보가 없어요. 페이지를 새로고침해 주세요.');
    var ps = playersOf(c);
    for (var i = 0; i < ps.length; i++) if (S(ps[i].deviceId) === S(id)) return ps[i];
    if (!create) return null;
    var x = { code: S(c.code), deviceId: S(id), round: S(c.round), joinedAt: now, quizAt: '', w1: 0, w2: 0, w3: 0,
              prediction: '', amount: '', submittedAt: '', _d: true };
    db.players.push(x); dirty = true;
    return x;
  }
  function pub(c) {
    return { code: S(c.code), name: S(c.name), students: N(c.students), status: S(c.status) || 'open', round: S(c.round) };
  }
  function summary(c) {
    var ps = playersOf(c);
    var sub = ps.filter(function (x) { return S(x.submittedAt) !== ''; });
    var d = sub.map(function (x) { return N(x.amount); });
    var total = d.reduce(function (s, v) { return s + v; }, 0);
    var target = N(c.students) * 800;
    return {
      joined: ps.length,
      quizPassed: ps.filter(function (x) { return S(x.quizAt) !== ''; }).length,
      submitted: sub.length, total: total, target: target, success: target > 0 && total >= target, donations: d,
      yes: sub.filter(function (x) { return S(x.prediction) === 'yes'; }).length,
      no: sub.filter(function (x) { return S(x.prediction) === 'no'; }).length,
      wrong: [1, 2, 3].map(function (k) { return ps.reduce(function (s, x) { return s + N(x['w' + k]); }, 0); })
    };
  }
  function teacher() { if (S(p.pin) !== S(PIN)) throw new Error('교사 PIN이 맞지 않아요.'); }
  function touch(c) { c._d = true; dirty = true; }
  function studentsOf(v) {
    var n = Math.floor(N(v));
    if (n < 1 || n > 60) throw new Error('학생 수는 1~60명 사이로 입력해 주세요.');
    return n;
  }
  var c, x, s, o;

  switch (a) {
    /* ---------- 학생 ---------- */
    case 'classInfo':
      c = findClass(p.code); o = pub(c); o.target = o.students * 800;
      if (o.status === 'revealed') {
        s = summary(c); o.total = s.total; o.success = s.success;
        o.best = s.donations.length ? 1000 - Math.min.apply(null, s.donations) + (s.success ? 1500 : 0) : 0;
      }
      return { result: o, dirty: dirty };

    case 'join':
      c = findClass(p.code); x = getPlayer(c, p.deviceId, true);
      return { result: { submitted: S(x.submittedAt) !== '', amount: N(x.amount) }, dirty: dirty };

    case 'quizPass':
      c = findClass(p.code); x = getPlayer(c, p.deviceId, true);
      if (!S(x.quizAt)) {
        var w = p.wrong || [];
        x.quizAt = now; x.w1 = N(w[0]); x.w2 = N(w[1]); x.w3 = N(w[2]); x._d = true; dirty = true;
      }
      return { result: true, dirty: dirty };

    case 'submit':
      c = findClass(p.code); x = getPlayer(c, p.deviceId, true);
      if (S(x.submittedAt)) return { result: { already: true, amount: N(x.amount) }, dirty: dirty };
      if (S(c.status) !== 'open') throw new Error('제출이 마감되었어요.');
      var amt = Number(p.amount);
      if (!(amt >= 0 && amt <= 1000 && Math.floor(amt) === amt)) throw new Error('0부터 1,000 사이의 정수를 입력해 주세요.');
      x.amount = amt;
      x.prediction = p.prediction === 'yes' ? 'yes' : (p.prediction === 'no' ? 'no' : '');
      x.submittedAt = now;
      if (!S(x.quizAt)) x.quizAt = now;
      x._d = true; dirty = true;
      return { result: { already: false, amount: amt }, dirty: dirty };

    /* ---------- 교사 ---------- */
    case 'login':
      teacher();
      return { result: true, dirty: false };

    case 'listClasses':
      teacher();
      return {
        result: db.classes.map(function (c) {
          var s = summary(c), o = pub(c);
          o.joined = s.joined; o.submitted = s.submitted; o.total = s.total; o.target = s.target; o.success = s.success;
          o.zero = s.donations.filter(function (v) { return v === 0; }).length;
          o.avg = s.submitted ? s.total / s.submitted : 0;
          o.createdAt = S(c.createdAt);
          return o;
        }),
        dirty: false
      };

    case 'createClass':
      teacher();
      var name = S(p.name).trim();
      if (!name) throw new Error('반 이름을 입력해 주세요.');
      var n = studentsOf(p.students), code;
      do { code = String(1000 + Math.floor(Math.random() * 9000)); }
      while (db.classes.some(function (k) { return S(k.code) === code; }));
      c = { code: code, name: name, students: n, status: 'open', round: newRound(), createdAt: now, _d: true };
      db.classes.push(c); dirty = true;
      return { result: pub(c), dirty: dirty };

    case 'updateClass':
      teacher(); c = findClass(p.code);
      if (p.students != null) c.students = studentsOf(p.students);
      if (p.name != null && S(p.name).trim()) c.name = S(p.name).trim();
      touch(c);
      return { result: pub(c), dirty: dirty };

    case 'setStatus':
      teacher(); c = findClass(p.code);
      if (['open', 'closed', 'revealed'].indexOf(p.status) < 0) throw new Error('알 수 없는 상태예요.');
      c.status = p.status; touch(c);
      return { result: pub(c), dirty: dirty };

    case 'resetClass':
      teacher(); c = findClass(p.code);
      c.round = newRound(); c.status = 'open'; touch(c);
      return { result: pub(c), dirty: dirty };

    case 'teacherView':
      teacher(); c = findClass(p.code); s = summary(c); o = pub(c);
      for (var k in s) o[k] = s[k];
      if (o.status !== 'revealed') { delete o.donations; delete o.total; delete o.success; delete o.yes; delete o.no; }
      return { result: o, dirty: false };

    default:
      throw new Error('알 수 없는 요청이에요: ' + a);
  }
}


/* ---------- 데모 모드 서버 흉내 ---------- */
const Mock = {
  PIN: '1234',
  load(){
    return jget('mgc_demo_db') || { classes: [{ code:'1234', name:'데모반', students:30, status:'open', round:'r0', createdAt:new Date().toISOString() }], players: [] };
  },
  call(a, p){
    return new Promise((res, rej) => setTimeout(() => {
      try{
        const d = this.load();
        const out = a === 'demoFill' ? this.fill(d, p) : Logic(a, p, d, this.PIN).result;
        d.classes.forEach(x => delete x._d); d.players.forEach(x => delete x._d);
        jset('mgc_demo_db', d);
        res(JSON.parse(JSON.stringify(out)));
      }catch(e){ rej(e); }
    }, 120));
  },
  fill(d, p){
    const c = d.classes.find(x => String(x.code) === String(p.code));
    if (!c) throw new Error('학급이 없어요');
    if (c.status !== 'open') throw new Error('제출 받는 중일 때만 채울 수 있어요');
    const mine = d.players.filter(x => x.code === c.code && x.round === c.round);
    const need = Math.max(0, c.students - mine.filter(x => x.submittedAt).length - 1);
    const now = new Date().toISOString();
    for (let i = 0; i < need; i++){
      const r = Math.random();
      const amt = r < .3 ? 0 : r < .45 ? 1000 : r < .65 ? 800 : Math.round(Math.random() * 20) * 50;
      d.players.push({ code:c.code, deviceId:'v'+Math.random().toString(36).slice(2), round:c.round, joinedAt:now, quizAt:now,
        w1:Math.random()<.3?1:0, w2:Math.random()<.15?1:0, w3:Math.random()<.35?Math.ceil(Math.random()*2):0,
        prediction:Math.random()<.5?'yes':'no', amount:amt, submittedAt:now });
    }
    return need;
  }
};

function bindAmount(){

function S_go(stage){ ST.L.stage = stage; saveL(); renderS(); }
function S_pick(k){
  if (ST.res) return;
  const L = ST.L, q = ST.quiz[L.qi];
  ST.picked = k;
  const ok = L.orders[L.qi][k] === q.ans;
  ST.res = ok ? 'right' : 'wrong';
  if (!ok){ L.wrong[L.qi]++; saveL(); }
  renderS();
}
function S_retry(){ ST.picked = null; ST.res = null; renderS(); }
function S_next(){
  const L = ST.L;
  ST.picked = null; ST.res = null; L.qi++;
  if (L.qi >= 3){ L.qi = 2; L.stage = 'predict'; api('quizPass', { code:ST.code, deviceId:L.id, wrong:L.wrong }).catch(() => {}); }
  saveL(); renderS();
}
function S_predict(v){ ST.L.prediction = v; ST.L.stage = 'amount'; saveL(); renderS(); }
function S_ask(){
  const a = Number(ST.draft);
  if (ST.draft === '' || !Number.isInteger(a) || a < 0 || a > 1000){ toast('0부터 1,000 사이의 정수를 입력해 주세요.'); return; }
  ST.confirm = true; renderS();
}
function S_cancel(){ ST.confirm = false; renderS(); }
async function S_submit(){
  ST.busy = true; renderS();
  try{
    const r = await api('submit', { code:ST.code, deviceId:ST.L.id, prediction:ST.L.prediction, amount:Number(ST.draft) });
    ST.L.amount = r.amount; ST.L.stage = 'wait'; saveL();
  }catch(e){
    toast(e.message);
    try{ ST.info = await api('classInfo', { code:ST.code }); }catch(_){}
  }
  ST.busy = false; ST.confirm = false; renderS();
}
function startPoll(){ clearInterval(ST.timer); ST.timer = setInterval(() => S_poll(false), 5000); }
async function S_poll(manual){
  if (VIEW !== 'student' || !ST.L || ST.L.stage === 'result') return;
  let info;
  try{ info = await api('classInfo', { code:ST.code }); }
  catch(e){ if (manual) toast(e.message); return; }
  const prev = ST.info; ST.info = info;
  if (info.round !== ST.L.round){
    toast('선생님이 실험을 새로 시작했어요.');
    store.del(lkey()); stopTimers();
    return enterCode(ST.code);
  }
  const L = ST.L;
  if (L.stage === 'wait' && info.status === 'revealed') return renderS();
  if (['rules','quiz','predict','amount'].includes(L.stage) && prev.status !== info.status) return renderS();
  if (manual) toast('아직 결과 공개 전이에요. 조금만 기다려 주세요!');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && VIEW === 'student' && ST.L) S_poll(false); });

  const p3 = `<section class="card panel"><div class="p-t">3. 0포인트를 낸 학생</div>
    <div class="bigv">${zero}<small>명 (${pct(zero, n)}%)</small></div>
    <p class="muted" style="margin:4px 0 0">한 포인트도 내지 않았지만 ${ok ? '1,500포인트 혜택을 똑같이 받았어요.' : '공기청정기를 사지 못해 모두 혜택을 받지 못했어요.'}</p>
    <div class="kv"><div><span>평균 기부액</span><b>${fmt(avg)}</b></div><div><span>평균 최종 포인트</span><b>${fmt(avgF)}</b></div><div><span>최고 최종 포인트</span><b>${fmt(maxF)}</b><small style="display:block;color:var(--muted);font-size:14px">${finals.filter(x => x === maxF).length}명 동점</small></div></div></section>`;
  const py = v.yes || 0, pn = v.no || 0, pt = py + pn;
  const p4 = `<section class="card panel"><div class="p-t">4. 예측: "모두가 합리적이라면 살 수 있을까?"</div>
    <div class="dist-row"><span class="dl">⭕ 예</span><div class="dtrack"><i style="width:${pct(py, pt)}%"></i></div><span class="dc">${py}명</span></div>
    <div class="dist-row"><span class="dl">❌ 아니오</span><div class="dtrack"><i class="zero" style="width:${pct(pn, pt)}%"></i></div><span class="dc">${pn}명</span></div>
    <p style="margin:14px 0 0;font-size:20px"><b>${pct(pn, pt)}%</b>가 "못 산다"고 예측했고, 실제로는 <b>${ok ? '샀어요' : '못 샀어요'}</b>.</p></section>`;
  const panels = [p1, p2, p3, p4].map((p, i) => i < step ? p : `<section class="card panel hide">?</section>`);
  return nav + `<div class="r-grid">${panels.join('')}</div>`;
}
function T_step(i){ TT.step = i; TT.tax = false; renderRoom(); }
function T_tax(){ TT.tax = !TT.tax; renderRoom(); }
async function T_status(s){
  try{ await api('setStatus', { pin:TT.pin, code:TT.code, status:s }); if (s === 'revealed'){ TT.step = 1; TT.tax = false; } TT.sig = ''; T_poll(); }
  catch(e){ toast(e.message); }
}
async function T_editN(){
  const val = await modal({ title:'학생 수 수정', body:'오늘 실제로 참여하는 학생 수를 입력하세요. 목표 금액이 다시 계산돼요.', ok:'저장', input:{ value:TT.v.students } });
  if (val == null) return;
  try{ await api('updateClass', { pin:TT.pin, code:TT.code, students:Number(val) }); TT.sig = ''; T_poll(); }catch(e){ toast(e.message); }
}
async function T_reset(){
  const ok = await modal({ title:'이 반을 새 판으로 시작할까요?', body:'학생 디벗 화면도 처음 화면으로 돌아가요. 이전 제출 기록은 시트에 남아 있어요.', ok:'초기화' });
  if (!ok) return;
  try{ await api('resetClass', { pin:TT.pin, code:TT.code }); TT.step = 1; TT.tax = false; TT.sig = ''; T_poll(); toast('새 판으로 시작했어요.'); }catch(e){ toast(e.message); }
}
async function T_demoFill(){
  try{ const n = await api('demoFill', { code:TT.code }); toast(`가상 학생 ${n}명이 제출했어요. (1명은 학생 화면으로 직접 해 보세요)`); TT.sig = ''; T_poll(); }catch(e){ toast(e.message); }
}

/* =========================================================
   시작
   ========================================================= */
function boot(){
  stopTimers();
  if (DEMO){
    const bar = document.getElementById('demobar');
    bar.hidden = false;
    bar.innerHTML = `<b>데모 모드</b><span style="opacity:.75">서버 연결 전 미리보기</span>
      <button data-v="student" class="${VIEW === 'student' ? 'on' : ''}">학생 화면</button>
      <button data-v="teacher" class="${VIEW === 'teacher' ? 'on' : ''}">교사 화면</button>
      <button id="dreset">데모 초기화</button>`;
    bar.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { VIEW = b.dataset.v; boot(); });
    bar.querySelector('#dreset').onclick = () => { store.keys().filter(k => k && k.startsWith('mgc_')).forEach(k => store.del(k)); boot(); toast('데모 기록을 지웠어요.'); };
  }
  if (VIEW === 'teacher') startTeacher(); else startStudent();
}
boot();
</script>
